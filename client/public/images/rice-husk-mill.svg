  <path d="M 0 450 Q 200 420 400 460 T 800 430 L 800 600 L 0 600 Z" fill="#111a26" opacity="0.95"/>
  <path d="M 0 500 Q 300 460 600 520 T 800 490 L 800 600 L 0 600 Z" fill="#0d141e"/>
  
