  <line x1="255" y1="320" x2="345" y2="280" stroke="#e3a72f" stroke-width="3" stroke-dasharray="4,4"/>
  <line x1="345" y1="280" x2="440" y2="340" stroke="#e3a72f" stroke-width="3" stroke-dasharray="4,4"/>

