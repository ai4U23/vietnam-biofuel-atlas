  </defs>
  <rect width="800" height="600" fill="url(#bgGrad3)"/>
  <circle cx="500" cy="180" r="130" fill="#34d399" opacity="0.12"/>
  <path d="M 0 460 Q 300 420 600 480 T 800 450 L 800 600 L 0 600 Z" fill="#0d1b18"/>

  <!-- Dome Digesters -->
