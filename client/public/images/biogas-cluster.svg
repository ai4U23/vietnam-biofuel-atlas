  <rect x="495" y="315" width="28" height="35" rx="4" fill="#34d399"/>

  <!-- Circular pipeline loop -->
  <path d="M 270 340 C 270 280, 510 260, 510 315" stroke="url(#bioGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="6,6"/>
  
  <!-- Flame/Energy Icon -->
  <circle cx="390" cy="240" r="32" fill="#0f2621" stroke="#34d399" stroke-width="3"/>
  <path d="M 390 220 Q 405 240 390 255 Q 375 240 390 220 Z" fill="#34d399"/>
