<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c141f"/>
      <stop offset="40%" stop-color="#142132"/>
      <stop offset="80%" stop-color="#1c2d42"/>
      <stop offset="100%" stop-color="#2a3f58"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182c44" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e3a72f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f1b2b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fieldGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a344" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e3a72f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a6844" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(227, 167, 47, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Topographic Delta Landscape Lines & Contours -->
  <path d="M 0 550 Q 400 480 800 580 T 1600 510 L 1600 900 L 0 900 Z" fill="#111c2a" opacity="0.9"/>
  <path d="M 0 640 Q 500 560 1000 670 T 1600 620 L 1600 900 L 0 900 Z" fill="#162436" opacity="0.85"/>

  <!-- Agricultural Fields / Paddies -->
  <polygon points="150,680 480,620 620,740 220,820" fill="url(#fieldGold)"/>
  <polygon points="520,610 890,560 980,660 580,720" fill="url(#fieldGold)" opacity="0.7"/>
  <polygon points="920,570 1350,530 1480,630 1010,690" fill="url(#fieldGold)" opacity="0.5"/>

  <!-- Mekong River Channels -->
  <path d="M -50 720 C 300 700, 500 840, 850 760 C 1200 680, 1400 820, 1650 780" fill="none" stroke="url(#riverGrad)" stroke-width="48" stroke-linecap="round"/>
  <path d="M 400 710 C 650 750, 750 890, 1100 830 C 1350 780, 1500 890, 1650 860" fill="none" stroke="url(#riverGrad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Golden Horizon Light -->
  <circle cx="1250" cy="420" r="320" fill="#e3a72f" opacity="0.08" filter="blur(60px)"/>
  <circle cx="350" cy="300" r="240" fill="#7d9d68" opacity="0.05" filter="blur(50px)"/>
</svg>
